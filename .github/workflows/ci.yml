name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Unit tests, lint and APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_DECODED=true" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_DECODED=false" >> "$GITHUB_ENV"
          fi
      - name: Run unit tests, lint and assemble APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_DECODED == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$KEYSTORE_DECODED" = "true" ]; then
            ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug --console=plain
          else
            ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
          fi
      - name: Upload release APK
        if: ${{ env.KEYSTORE_DECODED == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: radio-alarm-app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: radio-alarm-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish rolling nightly release
        if: ${{ github.ref == 'refs/heads/main' && env.KEYSTORE_DECODED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "radio-alarm-app-nightly.apk"
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin nightly
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly "radio-alarm-app-nightly.apk" --clobber
            gh release edit nightly \
              --title "Nightly build (${GITHUB_SHA:0:7})" \
              --notes "Continuous integration build from commit $GITHUB_SHA. Direct APK download signed with release key."
          else
            gh release create nightly "radio-alarm-app-nightly.apk" \
              --title "Nightly build (${GITHUB_SHA:0:7})" \
              --notes "Continuous integration build from commit $GITHUB_SHA. Direct APK download signed with release key." \
              --prerelease
          fi

  instrumented:
    name: Instrumented test (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on a local emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
